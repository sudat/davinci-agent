[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["services", "tests"]
# Golden derivation scripts are frozen evidence artifacts (byte-bound by their
# Gate policy); they are validated by the AST/import audit and frozen expected
# tables, and cannot be edited post-freeze to satisfy the type checker.
exclude = [".venv", "**/__pycache__", "tests/goldens/reference/**/derive.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
  "resolve_live: live DaVinci Resolve bridge tests; skipped with an explicit reason when Resolve is unreachable",
  "cloud_fixture: synthetic Cloud-model fixture tests; run only with the explicit synthetic-data policy env, skipped with an explicit reason otherwise",
  "mcp_live: live davinci-resolve-mcp tests; skipped with an explicit reason when the pinned server or Resolve is unreachable",
]
