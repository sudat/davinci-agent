[project]
name = "video-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "basedpyright",
    "duckdb",
    "hypothesis",
    "pytest",
    "ruff",
    "semgrep==1.120.0",
]

[tool.uv]
package = false
constraint-dependencies = ["setuptools<81"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "EM",
    "ISC001",
    "S603",
    "S607",
    "T201",
    "TC002",
    "TC003",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "D", "PLR2004", "S101", "S603", "S607", "SLF001"]
"tests/goldens/reference/**/derive.py" = ["PLR0913", "PLR0917"]
"services/resolve_bridge/connection.py" = ["N802", "N818"]
"services/resolve_bridge/faults.py" = ["N802", "N818", "ARG002", "RET501"]
"services/resolve_bridge/base_cut.py" = ["N802", "FBT003"]
"services/resolve_bridge/base_cut_models.py" = ["N802", "FBT001", "FBT002"]
"services/resolve_bridge/base_cut_fakes.py" = [
  "N802",
  "ARG001",
  "ARG002",
  "FBT001",
  "FBT002",
  "FBT003",
  "PLR0913",
  "PLR0917",
]
"services/resolve_bridge/base_cut_faults.py" = ["N802", "ARG002", "FBT001", "FBT002", "FBT003"]
"services/resolve_bridge/fixed_presentation.py" = ["C901", "PLR0912", "PLR0913", "PLR0917"]
"services/resolve_bridge/fixed_presentation_models.py" = ["N802", "FBT001", "FBT002"]
"services/resolve_bridge/fixed_presentation_render.py" = ["C901", "PLR0912", "PLR2004"]
"services/resolve_bridge/fixed_presentation_subtitle.py" = ["PLR0913", "PLR2004"]
"services/resolve_bridge/fixed_presentation_faults.py" = [
  "N802",
  "ARG002",
  "FBT001",
  "FBT002",
  "FBT003",
]
"services/resolve_bridge/fixed_presentation_fakes.py" = [
  "N802",
  "ARG002",
  "FBT001",
  "FBT002",
  "FBT003",
  "PLR0913",
  "PLR0917",
]
"services/resolve_bridge/fixed_presentation_cli.py" = ["PLR0913", "PLR0917"]
"services/resolve_bridge/launch.py" = ["N818"]
"services/resolve_bridge/build_report.py" = ["PLR0913", "PLR0917"]
"services/resolve_bridge/build_report_cli.py" = ["PLR0911", "PLR0913"]
"services/resolve_bridge/build_report_verify.py" = ["PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"services/resolve_bridge/build_report_fakes.py" = ["N802", "PLR0913"]
"services/resolve_bridge/build_report_faults.py" = ["PLR0913"]
"services/resolve_bridge/build_report_models.py" = ["PLR0913"]
"services/spike/gate_probes.py" = ["N802", "FBT001", "FBT003", "PLR0913", "PLR0917"]
"services/spike/recovery.py" = ["N802", "PLR0913"]
"services/spike/gate_driver.py" = ["PLR0913", "PLR0917", "PLR0915"]
"services/spike/gate_evaluate.py" = ["PLR0913", "PLR0917", "PLR0912", "C901"]
"services/spike/gate_fakes.py" = ["PLR0913"]
"services/spike/gate_faults.py" = ["PLR0913"]
"services/spike/gate_matrix.py" = ["PLR0913"]
"services/spike/run_gate.py" = ["PLR0911", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["services", "tests"]
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
  "resolve_live: live DaVinci Resolve bridge tests; skipped with an explicit reason when Resolve is unreachable",
]
